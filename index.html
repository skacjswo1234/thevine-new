    <script>
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const closeMenuToggle = document.getElementById('closeMenuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuOverlay = document.getElementById('menuOverlay');

        function openMenu() {
            mobileMenu.classList.add('active');
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            mobileMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        mobileMenuToggle.addEventListener('click', openMenu);
        closeMenuToggle.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        // 모바일 메뉴 내부 링크 클릭 시 메뉴 닫기
        const mobileMenuLinks = mobileMenu.querySelectorAll('a');
        mobileMenuLinks.forEach(link => {
            link.addEventListener('click', closeMenu);
        });

        // Top 버튼
        const topButton = document.getElementById('topButton');

        // 스크롤 이벤트 감지
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 300) {
                topButton.classList.add('visible');
            } else {
                topButton.classList.remove('visible');
            }
        });

        // Top 버튼 클릭 시 맨 위로 이동
        topButton.addEventListener('click', function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Notice Modal
        const noticeOverlay = document.getElementById('noticeOverlay');
        const noticeClose = document.getElementById('noticeClose');

        function openNotice() {
            if (!noticeOverlay) return;
            noticeOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeNotice() {
            if (!noticeOverlay) return;
            noticeOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 오버레이 배경 클릭 시 닫기
        if (noticeOverlay) {
            noticeOverlay.addEventListener('click', function(e) {
                if (e.target === noticeOverlay) {
                    closeNotice();
                }
            });
        }

        // 버튼 클릭 시 닫기
        if (noticeClose) {
            noticeClose.addEventListener('click', closeNotice);
        }

        // ESC로 닫기
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && noticeOverlay && noticeOverlay.classList.contains('active')) {
                closeNotice();
            }
        });

        // 새로고침/재방문 시마다 표시 (3초 지연)
        setTimeout(openNotice, 3000);
    </script>
